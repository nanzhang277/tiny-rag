[project]
name = "tiny-rag"
version = "0.1.0"
description = "一个仅供学习的迷你 RAG 系统：麻雀虽小，五脏俱全"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tiny-rag = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag"]
py-modules = ["cli"]
